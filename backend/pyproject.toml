[project]
name = "ledgerpilot"
version = "0.1.0"
description = "AI agent that turns invoices into bookkeeping, with a human in the loop (demo project)"
authors = [{ name = "Omar Mahfouz" }]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pdfplumber>=0.11.10",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
